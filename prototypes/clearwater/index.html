<title>Palais Mental Clearwater</title>
<style>
/* Layout: full-bleed WebGL pool; the app's own overlay (top bar, caption, Log button, bottom sheet) floats above it. */
:root {
  --bg: #07080B;
  --glass: rgba(15, 16, 21, 0.84);
  --glass-border: rgba(255, 255, 255, 0.08);
  --text: #F4F4F5;
  --text-dim: rgba(244, 244, 245, 0.55);
  --text-faint: rgba(244, 244, 245, 0.32);
  --primary: #F4F4F5;
  --on-primary: #0A0A0C;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--text-dim); outline-offset: 2px; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.overlay {
  position: fixed; inset: 0; z-index: 2; pointer-events: none;
  display: flex; flex-direction: column;
  padding-top: calc(env(safe-area-inset-top, 0px) + 8px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
}
.overlay button { pointer-events: auto; }
.title, .meta, .hint { text-shadow: 0 1px 10px rgba(0, 20, 50, 0.45); }
.top-bar { display: flex; justify-content: space-between; align-items: flex-start; padding: 0 20px; }
.title { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 0.3px; }
.meta { margin: 4px 0 0; font-size: 13px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.pill {
  background: var(--glass); border: 0.5px solid var(--glass-border); border-radius: 999px;
  padding: 8px 14px; color: var(--text); font-size: 13px; font-weight: 600; letter-spacing: 0.4px; cursor: pointer;
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
}
button:active { opacity: 0.7; }
.caption-wrap { flex: 1; display: flex; justify-content: center; align-items: flex-end; padding: 0 32px 12px; }
.caption {
  margin: 0; font-size: 15px; font-weight: 500; letter-spacing: 0.3px; text-align: center;
  text-shadow: 0 0 12px rgba(0, 0, 0, 0.8); transition: opacity .4s;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.caption.fade { opacity: 0; }
.bottom { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 0 16px; }
.hint { margin: 0; font-size: 13px; color: var(--text-faint); letter-spacing: 0.3px; text-align: center; }
.log-button {
  display: flex; align-items: center; gap: 8px; border: 0; cursor: pointer;
  background: var(--primary); color: var(--on-primary); border-radius: 999px; padding: 14px 28px;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
}
.log-button .plus { font-size: 20px; font-weight: 500; line-height: 22px; }
.log-button .log-text { font-size: 16px; font-weight: 600; letter-spacing: 0.3px; }

.scrim { position: fixed; inset: 0; z-index: 3; background: rgba(0, 0, 0, 0.25); animation: fade .25s ease; }
.sheet {
  position: fixed; z-index: 4; left: 0; right: 0; bottom: 0; margin: 0 auto; width: 100%; max-width: 560px; box-sizing: border-box;
  background: var(--glass); border: 0.5px solid var(--glass-border); border-bottom: 0;
  border-radius: 28px 28px 0 0; padding: 10px 20px calc(env(safe-area-inset-bottom, 0px) + 20px);
  -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
  animation: slide .3s cubic-bezier(.2, .8, .2, 1);
}
@keyframes slide { from { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }
.grabber { width: 36px; height: 4px; border-radius: 2px; background: var(--glass-border); margin: 0 auto 16px; }
.heading { margin: 0 0 16px; font-size: 20px; font-weight: 600; letter-spacing: 0.2px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile {
  display: flex; align-items: center; gap: 10px; padding: 16px 14px; border-radius: 16px; cursor: pointer; text-align: left;
  border: 0.5px solid var(--glass-border); background: rgba(255, 255, 255, 0.03); color: var(--text); font-size: 15px; font-weight: 500;
}
.dot { width: 8px; height: 8px; border-radius: 4px; flex: none; }
.head-row { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.link { background: none; border: 0; padding: 0; margin-right: 6px; color: var(--text-dim); font-size: 15px; cursor: pointer; }
.heading-inline { margin: 0; font-size: 18px; font-weight: 600; }
.label { display: block; color: var(--text-dim); font-size: 13px; margin-bottom: 8px; letter-spacing: 0.3px; }
.input {
  width: 100%; box-sizing: border-box; color: var(--text); font: 17px var(--font); border-radius: 14px;
  border: 0.5px solid var(--glass-border); background: rgba(255, 255, 255, 0.04); padding: 12px 14px; margin-bottom: 16px;
}
.input::placeholder { color: var(--text-faint); }
.stepper-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.stepper-row .label { margin: 0; }
.stepper { display: flex; align-items: center; gap: 14px; }
.step-btn {
  width: 38px; height: 38px; border-radius: 19px; border: 1px solid var(--glass-border); background: none;
  color: var(--text); font-size: 20px; line-height: 22px; cursor: pointer;
}
.step-value { font-size: 18px; font-variant-numeric: tabular-nums; min-width: 28px; text-align: center; }
.primary {
  width: 100%; border: 0; border-radius: 16px; padding: 15px; cursor: pointer;
  background: var(--primary); color: var(--on-primary); font-size: 16px; font-weight: 600;
}
.primary:disabled { opacity: 0.35; cursor: default; }
.fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; }
@media (prefers-reduced-motion: reduce) { .sheet, .scrim { animation: none; } }
</style>

<canvas id="gl" aria-label="Clear water pool. Tap the water to make ripples."></canvas>

<div class="overlay">
  <div class="top-bar">
    <div>
      <h1 class="title" id="appTitle"></h1>
      <p class="meta" id="meta"></p>
    </div>
    <button class="pill" id="langBtn" type="button"></button>
  </div>
  <div class="caption-wrap"><p class="caption" id="caption" aria-live="polite"></p></div>
  <div class="bottom">
    <p class="hint" id="hint"></p>
    <button class="log-button" id="logBtn" type="button"><span class="plus">+</span><span class="log-text" id="logLabel"></span></button>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<form class="sheet" id="sheet" hidden autocomplete="off">
  <div class="grabber"></div>
  <div id="stepPick">
    <h2 class="heading" id="chooseHeading"></h2>
    <div class="grid" id="grid"></div>
  </div>
  <div id="stepForm" hidden>
    <div class="head-row">
      <button class="link" id="backBtn" type="button"></button>
      <span class="dot" id="formDot"></span>
      <h2 class="heading-inline" id="formHeading"></h2>
    </div>
    <label class="label" for="title" id="titleLabel"></label>
    <input class="input" id="title" maxlength="120" enterkeyhint="done">
    <div class="stepper-row" id="episodesRow" hidden>
      <span class="label" id="episodesLabel"></span>
      <div class="stepper">
        <button class="step-btn" id="epMinus" type="button" aria-label="-">−</button>
        <span class="step-value" id="epValue">10</span>
        <button class="step-btn" id="epPlus" type="button" aria-label="+">+</button>
      </div>
    </div>
    <button class="primary" id="submitBtn" type="submit" disabled></button>
  </div>
</form>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js';

/* ---------------- Data & i18n (mirrors locales/*.json) ---------------- */
const CATEGORIES = ['movies', 'series', 'music', 'books', 'boardgames', 'videogames'];
const ACCENT = { movies: '#60A5FA', series: '#C084FC', music: '#FBBF24', books: '#F59E0B', boardgames: '#34D399', videogames: '#F472B6' };
const STRINGS = {
  en: {
    title: 'Mental Palace', items: (n) => `${n} ${n === 1 ? 'memory' : 'memories'}`, hint: 'Tap the water to ripple it',
    categories: { movies: 'Movies', series: 'TV Series', music: 'Music', books: 'Books', boardgames: 'Board Games', videogames: 'Video Games' },
    button: 'Log', choose: 'What are you logging?', titleLabel: 'Title', placeholder: (e) => `e.g. ${e}`,
    episodes: 'Episodes in season 1', submit: 'Add to the palace', back: 'Back',
    examples: { movies: 'In the Mood for Love', series: 'The Leftovers', music: 'Kind of Blue', books: 'Invisible Cities', boardgames: 'Azul', videogames: 'Outer Wilds' },
  },
  fr: {
    title: 'Palais Mental', items: (n) => `${n} ${n <= 1 ? 'souvenir' : 'souvenirs'}`, hint: "Touchez l'eau pour la faire onduler",
    categories: { movies: 'Films', series: 'Séries TV', music: 'Musique', books: 'Livres', boardgames: 'Jeux de société', videogames: 'Jeux vidéo' },
    button: 'Ajouter', choose: "Qu'ajoutez-vous ?", titleLabel: 'Titre', placeholder: (e) => `ex. ${e}`,
    episodes: 'Épisodes dans la saison 1', submit: 'Ajouter au palais', back: 'Retour',
    examples: { movies: 'In the Mood for Love', series: 'The Leftovers', music: 'Kind of Blue', books: 'Les Villes invisibles', boardgames: 'Azul', videogames: 'Outer Wilds' },
  },
};
const LANG_CYCLE = ['system', 'en', 'fr'];
const LANG_LABEL = { system: 'Auto', en: 'EN', fr: 'FR' };

const KEY = 'palais-mental.clearwater.v2';
let state = { items: [], language: 'system' };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.items)) state = { ...state, ...s }; } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

/* ---------------- UI ---------------- */
const $ = (id) => document.getElementById(id);
const tr = () => STRINGS[state.language === 'system' ? ((navigator.language || 'en').startsWith('fr') ? 'fr' : 'en') : state.language];
let pickedCategory = null, episodes = 10;

function renderCount() { $('meta').textContent = tr().items(state.items.length); }
function renderText() {
  const t = tr();
  document.documentElement.lang = t === STRINGS.fr ? 'fr' : 'en';
  $('appTitle').textContent = t.title;
  $('hint').textContent = t.hint;
  $('logLabel').textContent = t.button;
  $('langBtn').textContent = LANG_LABEL[state.language];
  $('chooseHeading').textContent = t.choose;
  $('backBtn').textContent = `‹ ${t.back}`;
  $('titleLabel').textContent = t.titleLabel;
  $('episodesLabel').textContent = t.episodes;
  $('submitBtn').textContent = t.submit;
  $('grid').innerHTML = CATEGORIES.map(c =>
    `<button class="tile" type="button" data-cat="${c}"><span class="dot" style="background:${ACCENT[c]}"></span>${t.categories[c]}</button>`).join('');
  if (pickedCategory) { $('formHeading').textContent = t.categories[pickedCategory]; $('title').placeholder = t.placeholder(t.examples[pickedCategory]); }
  renderCount();
}
renderText();
$('langBtn').addEventListener('click', () => {
  state.language = LANG_CYCLE[(LANG_CYCLE.indexOf(state.language) + 1) % LANG_CYCLE.length];
  save(); renderText();
});

const sheet = $('sheet'), scrim = $('scrim');
function showStep(cat) {
  pickedCategory = cat;
  $('stepPick').hidden = !!cat; $('stepForm').hidden = !cat;
  if (cat) {
    $('formDot').style.background = ACCENT[cat];
    $('episodesRow').hidden = cat !== 'series';
    renderText();
    setTimeout(() => $('title').focus({ preventScroll: true }), 30);
  }
}
function openSheet() {
  $('title').value = ''; episodes = 10; $('epValue').textContent = episodes; $('submitBtn').disabled = true;
  showStep(null); sheet.hidden = false; scrim.hidden = false;
}
function closeSheet() { sheet.hidden = true; scrim.hidden = true; }
$('logBtn').addEventListener('click', openSheet);
scrim.addEventListener('click', closeSheet);
addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
$('grid').addEventListener('click', (e) => { const b = e.target.closest('[data-cat]'); if (b) showStep(b.dataset.cat); });
$('backBtn').addEventListener('click', () => showStep(null));
$('title').addEventListener('input', () => { $('submitBtn').disabled = !$('title').value.trim(); });
$('epMinus').addEventListener('click', () => { episodes = Math.max(1, episodes - 1); $('epValue').textContent = episodes; });
$('epPlus').addEventListener('click', () => { episodes = Math.min(64, episodes + 1); $('epValue').textContent = episodes; });
sheet.addEventListener('submit', (e) => {
  e.preventDefault();
  const title = $('title').value.trim();
  if (!pickedCategory || !title) return;
  const item = { id: Math.random().toString(36).slice(2), category: pickedCategory, title, createdAt: Date.now() };
  if (pickedCategory === 'series') item.seasons = [{ episodeCount: episodes, watched: 0 }];
  closeSheet();
  setTimeout(() => spawnDrop(item, true), 250);
});

const captionEl = $('caption');
let captionTimer = 0;
function showCaption(text) { clearTimeout(captionTimer); captionEl.textContent = text; captionEl.classList.remove('fade'); }
function hideCaption(delay) { captionTimer = setTimeout(() => captionEl.classList.add('fade'), delay); }

/* ---------------- Renderer ---------------- */
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas = $('gl');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'high-performance' });
} catch (err) {
  document.body.insertAdjacentHTML('beforeend', '<div class="fallback">This pool needs WebGL 2. Open it in a recent browser to see the water.</div>');
  throw err;
}
let pixelRatio = Math.min(devicePixelRatio || 1, 1.5);
renderer.setPixelRatio(pixelRatio);
renderer.autoClear = false;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 200);
const SUN = new THREE.Vector3(0.25, 0.42, -1).normalize();

/* ---------------- Shared GLSL ---------------- */
const COMMON = /* glsl */`
uniform vec3 uSunDir;
uniform float uTime;
float hash21(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3 += dot(p3, p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x), mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),f.x), f.y); }
float fbm(vec2 p){ float a=.5, s=0.; for(int i=0;i<5;i++){ s+=a*vnoise(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return s; }
vec3 skyCol(vec3 d){
  float y = d.y;
  vec3 zen = vec3(0.035, 0.24, 0.78), hor = vec3(0.62, 0.86, 1.0);
  vec3 c = mix(hor, zen, pow(clamp(y, 0., 1.), 0.5));
  if (y < 0.0) c = hor*0.85;
  float s = max(dot(d, uSunDir), 0.);
  if (y > 0.004) {
    vec2 p = d.xz/(y + 0.06)*0.55 + vec2(uTime*0.006, uTime*0.002);
    float cl = fbm(p*1.4) + 0.25*fbm(p*5.0) - 0.1;
    cl = smoothstep(0.52, 0.92, cl) * smoothstep(0.0, 0.18, y);
    vec3 cc = vec3(1.0, 1.0, 1.02)*(0.95 + 0.6*pow(s, 6.0)) - vec3(0.18,0.12,0.04)*smoothstep(0.7,1.1,cl);
    c = mix(c, cc*1.2, cl*0.9);
  }
  c += vec3(1.0, 0.95, 0.82)*(pow(s, 1400.0)*60.0 + pow(s, 90.0)*0.9 + pow(s, 8.0)*0.18);
  return c;
}
vec3 tonemap(vec3 x){ x *= 0.92; x = clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0., 1.); return pow(x, vec3(1.0/2.2)); }
`;

/* ---------------- Ripple simulation (wave equation on a height field) ---------------- */
const SIM_N = 256, SIM_EXT = 3.0;
const rtOpts = { type: THREE.HalfFloatType, format: THREE.RGBAFormat, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false, stencilBuffer: false };
let simA = new THREE.WebGLRenderTarget(SIM_N, SIM_N, rtOpts);
let simB = new THREE.WebGLRenderTarget(SIM_N, SIM_N, rtOpts);
const simScene = new THREE.Scene(), simCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const simQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
simScene.add(simQuad);
const SIM_VS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
const stepMat = new THREE.ShaderMaterial({
  uniforms: { uTex: { value: null }, uDelta: { value: new THREE.Vector2(1 / SIM_N, 1 / SIM_N) } },
  vertexShader: SIM_VS,
  fragmentShader: `
    uniform sampler2D uTex; uniform vec2 uDelta; varying vec2 vUv;
    void main(){
      vec4 info = texture2D(uTex, vUv);
      vec2 dx = vec2(uDelta.x, 0.), dy = vec2(0., uDelta.y);
      float avg = (texture2D(uTex, vUv-dx).r + texture2D(uTex, vUv+dx).r + texture2D(uTex, vUv-dy).r + texture2D(uTex, vUv+dy).r)*0.25;
      info.g += (avg - info.r)*2.0;
      float e = smoothstep(0.0, 0.14, min(min(vUv.x, 1.-vUv.x), min(vUv.y, 1.-vUv.y)));
      info.g *= mix(0.9, 0.9955, e);
      info.r += info.g;
      info.r *= mix(0.95, 1.0, e);
      gl_FragColor = info;
    }`,
});
const dropMat = new THREE.ShaderMaterial({
  uniforms: { uTex: { value: null }, uCenter: { value: new THREE.Vector2() }, uRadius: { value: 0.03 }, uStrength: { value: -0.04 } },
  vertexShader: SIM_VS,
  fragmentShader: `
    uniform sampler2D uTex; uniform vec2 uCenter; uniform float uRadius, uStrength; varying vec2 vUv;
    void main(){
      vec4 info = texture2D(uTex, vUv);
      float d = max(0.0, 1.0 - length(uCenter - vUv)/uRadius);
      d = 0.5 - cos(d*3.14159265)*0.5;
      info.r += d*uStrength;
      gl_FragColor = info;
    }`,
});
function simPass(mat) {
  mat.uniforms.uTex.value = simA.texture;
  simQuad.material = mat;
  renderer.setRenderTarget(simB);
  renderer.render(simScene, simCam);
  [simA, simB] = [simB, simA];
}
const simQueue = [];
function ripple(x, z, radiusWorld, strength) {
  simQueue.push([x / (2 * SIM_EXT) + 0.5, z / (2 * SIM_EXT) + 0.5, radiusWorld / (2 * SIM_EXT), strength]);
}
for (const rt of [simA, simB]) { renderer.setRenderTarget(rt); renderer.setClearColor(0x000000, 0); renderer.clear(); }
renderer.setRenderTarget(null);

/* ---------------- Water: one full-screen pass (surface, refraction, pebbles, caustics, sky) ---------------- */
const MAX_IMP = 4;
const waterMat = new THREE.ShaderMaterial({
  depthTest: false, depthWrite: false,
  uniforms: {
    uSunDir: { value: SUN }, uTime: { value: 0 },
    uInvVP: { value: new THREE.Matrix4() }, uCam: { value: new THREE.Vector3() },
    uSim: { value: null }, uSimExt: { value: SIM_EXT }, uSimN: { value: SIM_N },
    uImp: { value: Array.from({ length: MAX_IMP }, () => new THREE.Vector4(0, 0, -99, 0)) },
    uImpCol: { value: Array.from({ length: MAX_IMP }, () => new THREE.Vector3()) },
    uDrop: { value: new THREE.Vector4(0, 0, 0, 0) }, uDropCol: { value: new THREE.Vector3(1, 1, 1) },
  },
  vertexShader: `varying vec2 vNdc; void main(){ vNdc = position.xy; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: COMMON + /* glsl */`
    uniform mat4 uInvVP; uniform vec3 uCam; uniform sampler2D uSim; uniform float uSimExt, uSimN;
    uniform vec4 uImp[${MAX_IMP}]; uniform vec3 uImpCol[${MAX_IMP}];
    uniform vec4 uDrop; uniform vec3 uDropCol;
    varying vec2 vNdc;
    float depthAt(vec2 xz){ return 0.5 + 0.16*max(-xz.y - 1.2, 0.0) + 0.08*(vnoise(xz*0.5) - 0.5); }

    vec2 simUV(vec2 xz){ return xz/(2.0*uSimExt) + 0.5; }
    float simH(vec2 uv){ return texture2D(uSim, uv).r; }
    float simMask(vec2 uv){ vec2 e = min(uv, 1.0-uv); return smoothstep(0.0, 0.1, min(e.x, e.y)); }
    vec2 simGrad(vec2 xz){
      vec2 uv = simUV(xz); float m = simMask(uv);
      if (m <= 0.0) return vec2(0.0);
      float tx = 1.0/uSimN, w = 2.0*uSimExt/uSimN;
      return vec2(simH(uv+vec2(tx,0.)) - simH(uv-vec2(tx,0.)), simH(uv+vec2(0.,tx)) - simH(uv-vec2(0.,tx)))/(2.0*w)*m;
    }
    float simLap(vec2 xz){
      vec2 uv = simUV(xz); float m = simMask(uv);
      if (m <= 0.0) return 0.0;
      float tx = 2.0/uSimN;
      return (simH(uv+vec2(tx,0.)) + simH(uv-vec2(tx,0.)) + simH(uv+vec2(0.,tx)) + simH(uv-vec2(0.,tx)) - 4.0*simH(uv))*m;
    }
    vec2 ambGrad(vec2 p, float far){
      vec2 g = vec2(0.0);
      for (int i = 0; i < 7; i++){
        float fi = float(i);
        float a = 0.9 + fi*2.39996;
        vec2 dir = vec2(cos(a), sin(a));
        float k = 2.6*pow(1.62, fi);
        float amp = 0.0075/pow(1.55, fi);
        float w = sqrt(9.81*k);
        float fade = i > 3 ? (1.0 - far) : 1.0;
        g += dir*amp*k*cos(k*dot(dir, p) - w*uTime*0.55 + fi*1.7)*fade;
      }
      vec2 q = p*7.0;
      g += (vec2(vnoise(q + uTime*0.35), vnoise(q.yx + 3.1 - uTime*0.3)) - 0.5)*0.035*(1.0-far);
      return g;
    }
    vec3 stoneColor(float h){
      vec3 c = vec3(0.22, 0.38, 0.62);
      c = mix(c, vec3(0.12, 0.22, 0.42), step(0.30, h));
      c = mix(c, vec3(0.40, 0.55, 0.72), step(0.50, h));
      c = mix(c, vec3(0.08, 0.14, 0.26), step(0.68, h));
      c = mix(c, vec3(0.24, 0.42, 0.64), step(0.80, h));
      c = mix(c, vec3(0.04, 0.07, 0.14), step(0.92, h));
      return c;
    }
    vec3 pebbles(vec2 p, float fw){
      vec2 q = p*8.5;
      vec2 ip = floor(q), fp = fract(q);
      float d1 = 8.0, d2 = 8.0; vec2 id = vec2(0.0);
      for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++){
        vec2 g = vec2(float(i), float(j));
        vec2 o = 0.5 + 0.4*sin(6.2831*hash22(ip + g));
        vec2 r = g + o - fp;
        float d = dot(r, r);
        if (d < d1){ d2 = d1; d1 = d; id = ip + g; } else if (d < d2){ d2 = d; }
      }
      float edge = sqrt(d2) - sqrt(d1);
      float h = hash21(id*1.37);
      float stone = smoothstep(0.05, 0.2, edge + 0.06*(vnoise(p*30.0) - 0.5));
      float dome = pow(clamp(edge*2.2, 0.0, 1.0), 0.6);
      vec3 sc = stoneColor(h)*(0.5 + 0.6*dome)*(0.88 + 0.24*vnoise(p*38.0 + h*20.0));
      vec3 sand = vec3(0.34, 0.47, 0.64)*(0.8 + 0.35*vnoise(p*60.0));
      vec3 col = mix(sand*0.5, sc, stone);
      return mix(col, vec3(0.24, 0.35, 0.52), smoothstep(0.25, 0.9, fw*8.5));
    }
    float caustic(vec2 uv){
      vec2 p = mod(uv*6.28318, 6.28318) - 250.0;
      vec2 i = p; float c = 1.0; float inten = 0.005;
      for (int n = 0; n < 5; n++){
        float t = uTime*0.45*(1.0 - 3.5/float(n+1));
        i = p + vec2(cos(t - i.x) + sin(t + i.y), sin(t - i.y) + cos(t + i.x));
        c += 1.0/length(vec2(p.x/(sin(i.x + t)/inten), p.y/(cos(i.y + t)/inten)));
      }
      c /= 5.0;
      c = 1.17 - pow(c, 1.4);
      return pow(abs(c), 8.0);
    }

    void main(){
      vec4 wp = uInvVP*vec4(vNdc, 1.0, 1.0);
      vec3 rd = normalize(wp.xyz/wp.w - uCam);
      vec3 col;
      if (rd.y > -0.0015){
        col = skyCol(rd);
      } else {
        float t = -uCam.y/rd.y;
        vec3 P = uCam + rd*t;
        float far = smoothstep(5.0, 28.0, t);
        vec2 g = ambGrad(P.xz, far) + simGrad(P.xz);
        vec3 N = normalize(vec3(-g.x, 1.0, -g.y));
        float cosi = max(dot(-rd, N), 0.0);
        float F = 0.02 + 0.98*pow(1.0 - cosi, 5.0);
        vec3 R = reflect(rd, N); R.y = abs(R.y);
        vec3 refl = skyCol(R);

        vec3 rr = refract(rd, N, 0.7499);
        float DEPTH = depthAt(P.xz);
        float L = DEPTH/max(-rr.y, 0.06);
        vec3 B = P + rr*L;
        float fw = length(fwidth(B.xz));
        vec3 bed = pebbles(B.xz, fw);

        float cf = 1.0 - smoothstep(0.03, 0.2, fw*3.0);
        vec2 cp = B.xz*0.62 + g*0.08;
        vec3 caus = vec3(caustic(cp + vec2(0.004, 0.0)), caustic(cp), caustic(cp - vec2(0.004, 0.0)));
        float focus = clamp(1.0 - simLap(B.xz - uSunDir.xz*0.4)*260.0, 0.25, 3.0);
        vec3 light = vec3(0.22, 0.36, 0.46) + vec3(1.0, 0.95, 0.85)*(0.45 + caus*2.4*cf)*focus;

        if (uDrop.w > 0.0){
          float hgt = max(uDrop.y, 0.0) + DEPTH;
          float d = length(B.xz - (uDrop.xz - uSunDir.xz/uSunDir.y*hgt));
          light *= 1.0 - 0.35*exp(-d*d/(0.02 + 0.01*hgt));
          light += uDropCol*2.5*exp(-d*d/(0.0015 + 0.002*hgt))/(0.6 + hgt);
        }

        vec3 sigma = vec3(0.55, 0.12, 0.09);
        vec3 refr = bed*light*exp(-sigma*(L + DEPTH*0.8));
        refr += vec3(0.0, 0.11, 0.17)*(1.0 - exp(-(L + DEPTH)*0.35));

        vec3 glow = vec3(0.0);
        for (int i = 0; i < ${MAX_IMP}; i++){
          vec4 im = uImp[i];
          float dt = uTime - im.z;
          if (im.w < 0.5 || dt < 0.0 || dt > 5.0) continue;
          float d = length(P.xz - im.xy);
          float ring = exp(-pow((d - dt*0.62)/(0.03 + dt*0.05), 2.0))*exp(-dt*1.1);
          float bloom = exp(-d*d/(0.01 + dt*0.09))*exp(-dt*0.75);
          refr += uImpCol[i]*(bloom*0.45 + ring*0.25);
          glow += uImpCol[i]*ring*0.22;
        }

        col = mix(refr, refl, F) + glow;
        col = mix(col, skyCol(normalize(vec3(rd.x, 0.02, rd.z))), smoothstep(14.0, 70.0, t)*0.75);
      }
      col *= 1.0 - 0.16*dot(vNdc*0.7, vNdc*0.7);
      gl_FragColor = vec4(tonemap(col), 1.0);
    }`,
});
const water = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), waterMat);
water.frustumCulled = false; water.renderOrder = -10;
scene.add(water);

/* ---------------- Drops ---------------- */
const dropBase = new THREE.ShaderMaterial({
  transparent: true, depthTest: false, depthWrite: false,
  uniforms: { uSunDir: { value: SUN }, uTime: { value: 0 }, uTint: { value: new THREE.Vector3(1, 1, 1) }, uStretch: { value: 1 }, uOpacity: { value: 0.96 } },
  vertexShader: /* glsl */`
    uniform float uStretch; varying vec3 vN; varying vec3 vW;
    void main(){
      vec3 p = position; float s = uStretch; float inv = inversesqrt(s);
      float top = max(position.y, 0.0);
      float taper = max(1.0 - top*top*(s - 1.0)*1.3, 0.15);
      float sy = position.y > 0.0 ? s : 1.0 + (s - 1.0)*0.25;
      p.y *= sy; p.xz *= inv*taper;
      vec3 n = normalize(vec3(normal.x/(inv*taper), normal.y/sy, normal.z/(inv*taper)));
      vec4 w = modelMatrix*vec4(p, 1.0);
      vW = w.xyz; vN = normalize(mat3(modelMatrix)*n);
      gl_Position = projectionMatrix*viewMatrix*w;
    }`,
  fragmentShader: COMMON + /* glsl */`
    uniform vec3 uTint; uniform float uOpacity; varying vec3 vN; varying vec3 vW;
    void main(){
      vec3 V = normalize(vW - cameraPosition); vec3 N = normalize(vN);
      float c = max(dot(-V, N), 0.0);
      float F = 0.04 + 0.96*pow(1.0 - c, 4.0);
      vec3 refl = skyCol(reflect(V, N));
      vec3 rd = refract(V, N, 0.75);
      vec3 flip = vec3(rd.x, -rd.y, rd.z);
      vec3 behind = flip.y > 0.0 ? skyCol(flip) : mix(vec3(0.03, 0.30, 0.36), vec3(0.35, 0.62, 0.6), smoothstep(-1.0, 0.0, flip.y));
      vec3 body = mix(behind, uTint*1.3, 0.38);
      float back = max(dot(N, -uSunDir), 0.0);
      body += uTint*pow(back, 5.0)*1.8 + vec3(1.0)*pow(back, 40.0)*2.0;
      vec3 col = mix(body, refl, F) + uTint*pow(1.0 - c, 2.5)*0.4;
      gl_FragColor = vec4(tonemap(col), uOpacity);
    }`,
});
const dropGeo = new THREE.SphereGeometry(1, 40, 28);
const sprayGeo = new THREE.SphereGeometry(1, 14, 10);
const G = 7.2;
const drops = [];
const impacts = [];
let impactSlot = 0;

function makeMesh(geo, color, r) {
  const m = new THREE.Mesh(geo, dropBase.clone());
  const c = new THREE.Color(color);
  m.material.uniforms.uTint.value.set(c.r, c.g, c.b);
  m.material.uniforms.uSunDir.value = SUN;
  m.scale.setScalar(r);
  m.frustumCulled = false;
  scene.add(m);
  return m;
}
function spawnDrop(item, log) {
  const color = ACCENT[item.category];
  const x = (Math.random() - 0.5) * 1.3, z = -0.35 - Math.random() * 1.1;
  const r = 0.085;
  const d = { kind: 'main', item, log, color, r, pos: new THREE.Vector3(x, 1.75, z), vel: new THREE.Vector3(0, 0, 0), age: 0, hang: 0.55, mesh: makeMesh(dropGeo, color, r) };
  d.mesh.scale.setScalar(0.0001);
  if (item.title) showCaption(item.category === 'series' ? `${item.title} · S1 · 0/${item.seasons[0].episodeCount}` : item.title);
  drops.push(d);
}
function spawnSpray(x, z, color, n, power) {
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + Math.random() * 0.4;
    const hs = (0.45 + Math.random() * 0.7) * power, vs = (1.0 + Math.random() * 1.2) * power;
    const r = (0.01 + Math.random() * 0.018) * Math.sqrt(power);
    const pos = new THREE.Vector3(x + Math.cos(a) * 0.07, 0.02, z + Math.sin(a) * 0.07);
    drops.push({ kind: 'spray', color, r, pos, vel: new THREE.Vector3(Math.cos(a) * hs, vs, Math.sin(a) * hs), age: 0, mesh: makeMesh(sprayGeo, color, r) });
  }
}
function impact(d) {
  const { x, z } = d.pos;
  const c = new THREE.Color(d.color);
  if (d.kind === 'main') {
    ripple(x, z, 0.22, -0.05);
    spawnSpray(x, z, d.color, reduced ? 8 : 18, 1);
    setTimeout(() => drops.push({ kind: 'jet', color: d.color, r: 0.042, pos: new THREE.Vector3(x, 0.02, z), vel: new THREE.Vector3(0, 2.5, 0), age: 0, mesh: makeMesh(sprayGeo, d.color, 0.042) }), 170);
    const u = waterMat.uniforms;
    u.uImp.value[impactSlot].set(x, z, clock.elapsedTime, 1);
    u.uImpCol.value[impactSlot].set(c.r, c.g, c.b);
    impactSlot = (impactSlot + 1) % MAX_IMP;
    if (d.item.title) hideCaption(1400);
    if (d.log) { state.items.push(d.item); save(); renderCount(); }
  } else if (d.kind === 'jet') {
    ripple(x, z, 0.1, -0.02);
    spawnSpray(x, z, d.color, reduced ? 3 : 6, 0.45);
  } else {
    ripple(x, z, 0.05, -0.006 * (d.r / 0.02));
  }
}
function updateDrops(dt) {
  let focus = null;
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.age += dt;
    let stretch = 1;
    if (d.kind === 'main' && d.age < d.hang) {
      const k = d.age / d.hang;
      const grow = 1 - Math.pow(1 - k, 3);
      d.mesh.scale.setScalar(d.r * grow);
      stretch = 1 + Math.sin(k * 14) * 0.12 * (1 - k) + k * 0.12;
    } else {
      d.vel.y -= G * dt;
      d.pos.addScaledVector(d.vel, dt);
      stretch = 1 + Math.min(Math.abs(d.vel.y) * (d.kind === 'main' ? 0.07 : 0.1), d.kind === 'main' ? 0.55 : 0.8);
    }
    d.mesh.material.uniforms.uStretch.value = stretch;
    d.mesh.position.copy(d.pos);
    if (d.kind === 'main') focus = d;
    if (d.pos.y - d.r * 0.3 <= 0 && d.vel.y < 0) {
      impact(d);
      scene.remove(d.mesh); d.mesh.material.dispose();
      drops.splice(i, 1);
    }
  }
  const u = waterMat.uniforms;
  if (focus) {
    u.uDrop.value.set(focus.pos.x, focus.pos.y, focus.pos.z, focus.mesh.scale.x / focus.r);
    const c = new THREE.Color(focus.color); u.uDropCol.value.set(c.r, c.g, c.b);
  } else u.uDrop.value.w = 0;
}

/* ---------------- Camera & input ---------------- */
const target = new THREE.Vector3(0, 0, -0.75);
let yaw = 0, pitch = 0.26, dist = 4.4;
function placeCamera(t) {
  const y = yaw + (reduced ? 0 : Math.sin(t * 0.13) * 0.035);
  const p = pitch + (reduced ? 0 : Math.sin(t * 0.21) * 0.01);
  camera.position.set(target.x + Math.sin(y) * Math.cos(p) * dist, target.y + Math.sin(p) * dist, target.z + Math.cos(y) * Math.cos(p) * dist);
  camera.lookAt(target);
}
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const portrait = w / h < 0.85;
  camera.fov = portrait ? 66 : 55;
  dist = portrait ? 5.0 : 4.4;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

let drag = null;
canvas.addEventListener('pointerdown', (e) => {
  closeSheet();
  drag = { x: e.clientX, y: e.clientY, yaw, pitch, moved: 0 };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.moved = Math.max(drag.moved, Math.hypot(dx, dy));
  if (drag.moved > 6) {
    yaw = THREE.MathUtils.clamp(drag.yaw - dx * 0.003, -0.7, 0.7);
    pitch = THREE.MathUtils.clamp(drag.pitch + dy * 0.002, 0.14, 0.75);
  }
});
canvas.addEventListener('pointerup', (e) => {
  if (drag && drag.moved <= 6) {
    const ndc = new THREE.Vector4((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1, 1, 1);
    ndc.applyMatrix4(waterMat.uniforms.uInvVP.value);
    const p = new THREE.Vector3(ndc.x / ndc.w, ndc.y / ndc.w, ndc.z / ndc.w);
    const rd = p.sub(camera.position).normalize();
    if (rd.y < -0.01) {
      const t = -camera.position.y / rd.y;
      ripple(camera.position.x + rd.x * t, camera.position.z + rd.z * t, 0.09, -0.018);
    }
  }
  drag = null;
});

/* ---------------- Loop ---------------- */
const clock = new THREE.Clock();
let acc = 0, frames = 0, frameTime = 0;
const vp = new THREE.Matrix4();
function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 30);
  const t = clock.elapsedTime;
  placeCamera(t);
  camera.updateMatrixWorld();
  vp.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse).invert();
  const u = waterMat.uniforms;
  u.uInvVP.value.copy(vp); u.uCam.value.copy(camera.position); u.uTime.value = t;

  updateDrops(dt);
  for (const d of drops) d.mesh.material.uniforms.uTime.value = t;

  while (simQueue.length) {
    const [cx, cy, r, s] = simQueue.shift();
    dropMat.uniforms.uCenter.value.set(cx, cy); dropMat.uniforms.uRadius.value = r; dropMat.uniforms.uStrength.value = s;
    simPass(dropMat);
  }
  acc += dt;
  let steps = 0;
  while (acc >= 1 / 110 && steps < 4) { simPass(stepMat); acc -= 1 / 110; steps++; }
  u.uSim.value = simA.texture;

  renderer.setRenderTarget(null);
  renderer.render(scene, camera);

  frameTime += dt; frames++;
  if (frames === 90) {
    const avg = frameTime / frames * 1000;
    if (avg > 24 && pixelRatio > 0.6) { pixelRatio = Math.max(0.6, pixelRatio - 0.25); renderer.setPixelRatio(pixelRatio); resize(); }
    frames = 0; frameTime = 0;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Opening moment: one unlabeled drop so the pool shows what it does.
setTimeout(() => spawnDrop({ category: 'videogames', title: '' }, false), 900);
</script>
