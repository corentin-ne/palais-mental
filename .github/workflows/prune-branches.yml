name: Prune merged branches

# Deletes every branch already fully merged into main (unmerged branches are kept).
# Runs when this file changes on main, or by hand.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prune-branches.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete merged branches
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin); do
            b="${ref#origin/}"
            [ "$b" = "main" ] || [ "$b" = "HEAD" ] || [ "$b" = "origin" ] && continue
            if git merge-base --is-ancestor "$ref" origin/main; then
              echo "Deleting $b (merged)"
              git push origin --delete "$b" || echo "Could not delete $b (the repository default branch cannot be deleted)"
            else
              echo "Keeping $b (not merged into main)"
            fi
          done
