name: Android release

# Builds an installable APK and attaches it to a GitHub release.
#  - push to main  → publishes "v<package.json version>" (a pre-release when the version has a "-")
#  - push a v* tag → publishes that tag (pre-release when it contains "-")
on:
  push:
    branches: [main]
    paths-ignore: ['.github/workflows/prune-branches.yml']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ships the Android SDK (ANDROID_HOME); Gradle installs missing platforms itself.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      # Every release must be signed with the same key, or Android refuses to install it over the
      # previous one. Expo's template signs release builds with android/app/debug.keystore: that file is
      # replaced by the copy kept in the repo (signing/), so a template change can never change the key.
      - name: Pin the signing key
        run: cp signing/palais-mental.keystore android/app/debug.keystore

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=2

      - name: Check the signature
        env:
          # SHA-256 of the certificate every release so far was signed with (see signing/README.md).
          EXPECTED: fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          ACTUAL=$("$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          echo "Signed with $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::The APK is not signed with the release key: it would not install over the previous version."
            exit 1
          fi

      - name: Resolve release tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Name the artifact
        run: cp android/app/build/outputs/apk/release/app-release.apk "palais-mental-${{ steps.tag.outputs.name }}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: palais-mental-apk
          path: palais-mental-*.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Palais Mental ${{ steps.tag.outputs.name }}
          files: palais-mental-*.apk
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
          generate_release_notes: true
          body: |
            Installable Android build for testing (signed with a debug key).
            Download the APK below, open it on your phone and allow installing from this source.
