name: Supabase keep-alive

# Free Supabase projects pause after a week without a query: Social (lib/supabase.ts) would stop answering.
# Twice a week, one call to the database's ping() keeps it awake.
on:
  schedule:
    - cron: '17 5 * * 1,4'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ping the database
        env:
          # The project's publishable key, the same one the app ships with.
          KEY: sb_publishable_R-_WG__Ym3h_GT96ZH1nng_pKotjSjy
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 20 \
            -X POST "https://gsfirtbwijqrgxxihfdd.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
